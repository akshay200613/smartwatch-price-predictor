<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smartwatch Price Prediction</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="background-effects">
        <div class="glow glow-1"></div>
        <div class="glow glow-2"></div>
    </div>

    <header class="glass-nav">
        <div class="logo">
            <i class="fa-solid fa-watch"></i> Smartwatch Analytics
        </div>
    </header>

    <main class="container">
        <section class="hero">
            <h1>Price Prediction Model</h1>
            <p>Estimate the market value of smartwatches based on specifications and brand power.</p>
        </section>

        <section class="glass-card">
            <div class="app-layout">
                <div class="input-panel">
                    <h3>Input Features</h3>
                    <div class="form-group">
                        <label for="sw-brand">Brand</label>
                        <select id="sw-brand">
                            <option value="noise">Noise</option>
                            <option value="boat">boAt</option>
                            <option value="fire-boltt">Fire-Boltt</option>
                            <option value="apple">Apple</option>
                            <option value="samsung">Samsung</option>
                            <option value="garmin">Garmin</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="sw-original">Original Price (₹)</label>
                        <input type="number" id="sw-original" placeholder="e.g. 5999" value="5999">
                    </div>
                    <div class="form-group">
                        <label for="sw-rating">Rating (1 to 5)</label>
                        <input type="number" step="0.1" id="sw-rating" placeholder="e.g. 4.2" value="4.2">
                    </div>
                    <button class="primary-btn" onclick="predictSmartwatch()">Predict Price <i class="fa-solid fa-arrow-right"></i></button>
                </div>
                
                <div class="result-panel">
                    <h3>Prediction Result</h3>
                    <div class="result-display">
                        <div class="price-tag" id="sw-result">₹ ---</div>
                        <p class="result-subtitle" id="sw-subtitle">Enter features to see prediction</p>
                    </div>
                    <div class="model-metrics">
                        <div class="metric"><span class="label">Model</span><span class="value">Random Forest Regressor</span></div>
                        <div class="metric"><span class="label">Accuracy</span><span class="value">87% R²</span></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
